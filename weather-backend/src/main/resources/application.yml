spring:
    application:
        name: weather
    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 16MB

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        operations-sorter: method
        tags-sorter: alpha

geoapify:
    map-api-key: ${GEOAPIFY_KEY:}
    search-api-key: ${GEOAPIFY_SEARCH_KEY:${GEOAPIFY_KEY:}}
    base-url: https://api.geoapify.com

weather:
    forecast-url: ${WEATHER_FORECAST_URL:}
    hourly-url: ${WEATHER_HOURLY_URL:}
    daily-url: ${WEATHER_DAILY_URL:}

analytics:
    refresh-url: ${ANALYTICS_REFRESH_URL:}
    refresh-status-url: ${ANALYTICS_REFRESH_STATUS_URL:}
    summary-url: ${ANALYTICS_SUMMARY_URL:}

aws:
    region: ${AWS_REGION:us-east-1}

dynamodb:
    users-table: ${USERS_TABLE:Users}
    starred-locations-table: ${STARRED_LOCATIONS_TABLE:StarredLocations}
    community-posts-table: ${COMMUNITY_POSTS_TABLE:CommunityPosts}
    post-feedback-table: ${POST_FEEDBACK_TABLE:PostFeedback}

storage:
    post-images-bucket: ${POST_IMAGES_BUCKET:}
    post-image-max-bytes: 5242880
    presigned-get-minutes: 15

jwt:
    secret: ${JWT_SECRET:}
